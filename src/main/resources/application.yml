spring:
  application:
    name: auto-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auto_tracker}
    username: ${DB_USER:auto_tracker}
    password: ${DB_PASSWORD:auto_tracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none           # schema owned by Liquibase
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: simple               # ConcurrentMapCacheManager (in-memory cohort cache)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  scraping:
    base-url: ${SCRAPE_BASE_URL:https://olx.ba/vozila}
    category-id: ${SCRAPE_CATEGORY_ID:18}
    delay-ms: ${SCRAPE_DELAY_MS:2000}
    max-pages: ${SCRAPE_MAX_PAGES:5}
    cron: ${SCRAPE_CRON:0 0 0/2 * * ?}
  digest:
    cron: ${DIGEST_CRON:0 7 * * * ?}
  mail:
    from: ${MAIL_FROM:auto-tracker@localhost}
    to: ${MAIL_TO:auto-tracker@localhost}
  scoring:
    year-tolerance: ${SCORE_YEAR_TOLERANCE:2}
    underpriced-threshold-pct: ${SCORE_UNDERPRICED_PCT:10}
  scrape:
    cron: ${SCRAPE_CRON:0 0 0/2 * * ?}
